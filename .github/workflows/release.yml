name: Preparar borrador de Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente, por ejemplo v0.6.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  draft:
    # Configurar este entorno con revisores y restringirlo a la rama protegida.
    environment: release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validar nombre del tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar versión y licencia
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== "v" + p.version || p.license !== "MIT") process.exit(1);'
          test -s LICENSE
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run check
      - run: npx --no-install cap sync android
      - name: Compilar sin secretos de firma
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon --max-workers=1 --console=plain
      - name: Firmar con clave permanente y verificar
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY_BASE64:?Falta clave permanente}"
          : "${SIGNING_STORE_PASSWORD:?Falta contraseña}"
          : "${SIGNING_KEY_PASSWORD:?Falta contraseña de clave}"
          : "${SIGNING_ALIAS:?Falta alias}"
          umask 077
          keyfile="$RUNNER_TEMP/sorteos-release.jks"
          trap 'rm -f -- "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keyfile"
          mkdir -p artifacts
          apk="artifacts/administrador-sorteos-${RELEASE_TAG}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$SIGNING_ALIAS" --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --out "$apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/verify-apk.py "$apk" --release --report artifacts/verificacion-apk.json
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Registrar fuente y entorno de compilación
        run: |
          { git rev-parse HEAD; node --version; java -version 2>&1; printf 'Gradle 8.14.3 / SDK 36 / Build Tools 36.0.0\n'; } > artifacts/COMPILACION.txt
      - name: Crear borrador privado para revisión
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS.txt artifacts/verificacion-apk.json artifacts/COMPILACION.txt --verify-tag --draft --prerelease --title "Administrador de Sorteos $RELEASE_TAG — prueba" --notes-file docs/NOTAS_VERSION.md
