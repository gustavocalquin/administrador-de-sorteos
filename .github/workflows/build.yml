name: Verificar y compilar APK de prueba
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
      - name: Herramientas Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run check
      - run: npx --no-install cap sync android
      - name: APK de prueba
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --console=plain
      - name: Inspeccionar paquete y firma
        run: python3 scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk --report artifacts/verificacion-apk.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-prueba-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/verificacion-apk.json
